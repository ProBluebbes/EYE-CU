# StrokeWatch tunables. Paths are relative to the repo root.

camera:
  width: 640
  height: 480
  # Mount angle, clockwise degrees (0/90/180/270), applied before processing so the
  # face is upright in the image. The head-tilt gate is measured in the rotated image.
  rotate: 0

vision:
  model_path: models/face_landmarker.task
  # Head-rotation removal: "2d" levels the eye line (roll only); "3d" uses MediaPipe's
  # transformation matrix; "blend" averages the two. Their head-turn errors partly cancel:
  # worst leftover turn bias on a setup left out of the yaw_bias fit was 1.4 (blend) vs
  # 2.3 (2d) and 2.6 (3d) points of score (Mac, iPhone, overhead clips; Nov 14 2026).
  # Changing this needs a refit of yaw_bias and yaw_gain (yaw_bias is ignored, with a
  # warning, otherwise).
  correction: blend
  # Frames with the head turned/tilted further than this are skipped.
  # Yaw 40: with yaw_bias, a head held anywhere within ±40 deg gives a fake score of at
  # most ~2.3 on a device left out of the fit (threshold 4). Without it, 35 deg gave ~6.
  # Beyond ~45 deg the talking gate starts misfiring and the curves differ per device.
  # Roll 40: pure sideways tilt (ear to shoulder) barely moves any feature up to ±43 deg
  # on the Mac and iPhone tilt clips.
  max_yaw_deg: 40
  max_pitch_deg: 20
  max_roll_deg: 40
  # Fake asymmetry each feature shows when the head is turned (yaw, degrees), subtracted
  # per frame (linear interpolation; clamped beyond the ends). Fitted with equal weight per
  # clip, so it's a middle ground between devices. Refit (and paste) after recording more
  # people/devices:  python scripts/fit_yaw_bias.py clips/*.mov
  # Only used if `correction` matches; null = off.
  # Fitted by scripts/fit_yaw_bias.py on: macsidetoside.mov, phonesidetoside.MOV, mactilt.mov, phonetilt.MOV, tilt.mov
  yaw_bias:
    correction: blend
    knots: [-60, -50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50, 60]
    mouth_diff: [0.06741, 0.05272, 0.03632, 0.02570, 0.01796, 0.00832, 0.00000, -0.00824, -0.01971, -0.03924, -0.06043, -0.08004, -0.09576]
    eye_ratio: [-0.22986, -0.23269, -0.17101, -0.08259, -0.01893, 0.00742, 0.00000, 0.01893, 0.06902, 0.13775, 0.17599, 0.15337, 0.08822]
    brow_diff: [-0.12856, -0.08982, -0.04574, -0.01698, -0.00848, -0.00555, -0.00000, 0.00821, 0.01573, 0.02548, 0.04145, 0.06976, 0.10564]
  # Frames are skipped while the head turns/tilts faster than this (deg/s): landmarks lag
  # behind a moving head, about doubling the mouth error. 0 = off.
  max_head_speed_dps: 30
  # Gaze (BE-FAST eyes) is measured up to this head turn, separately from max_yaw_deg (it is
  # also measured while talking): a stroke often turns the head with the eyes. Beyond ~30 deg
  # the far eye is hidden, so this stays below max_yaw_deg.
  gaze_max_yaw_deg: 30
  # Talking/eating -> frame skipped if the inner-lip gap at the mouth centre
  # (fraction of eye-corner distance) or the jawOpen blendshape exceeds these.
  # Don't gate on jawOpen alone: it rises with a one-sided droop too.
  lip_gap_max: 0.06
  jaw_open_max: 0.35
  # eyeBlink blendshape above this = blinking -> eye feature (and gaze) skipped for that frame.
  blink_max: 0.45
  # MediaPipe Pose model, only run during the BE-FAST check's arm/leg steps. Joints with
  # visibility below pose_min_visibility count as "not in view".
  pose_model_path: models/pose_landmarker_lite.task
  pose_min_visibility: 0.5

detector:
  # Seconds of VALID frames needed to build the baseline.
  baseline_seconds: 20
  min_baseline_frames: 60
  # Floor on the robust spread (1.4826 * MAD) so a very still baseline doesn't
  # turn sub-pixel jitter into huge z-scores. Units: fraction of eye-corner distance
  # (eye_ratio is a log ratio).
  # mouth_diff 0.004 ≈ 0.36 mm (x 90 mm eye-corner distance): threshold 4 ≈ 1.4 mm of
  # tracked change. The tracker reports only ~65-75% of a real droop facing the camera, so
  # that's ≈ 2.5 mm of real mouth-corner droop (held-angle tests, Nov 14 2026). Turned heads
  # get more tolerance via yaw_noise. Was 0.012 (≈ 7-8 mm real). Lower = more sensitive but
  # more false alarms from expressions; still-head noise is ~0.1 mm.
  min_spread:
    mouth_diff: 0.004
    eye_ratio: 0.10
    brow_diff: 0.015
  # Safety margin for head turns: spread is widened by this much per 10 deg of yaw away
  # from the baseline's median yaw (added in quadrature), so turn bias that yaw_bias
  # doesn't fully remove (other people/cameras) fades the score instead of alerting.
  # Costs sensitivity only while the head is turned. 0 / omitted = off.
  # 0.002 for the mouth (with the 0.004 floor): a neutral face held anywhere within ±35 deg
  # peaked at 2.4 (threshold 4) on clips from a device left out of the yaw_bias fit, while
  # a real droop of ~2.5 mm still alerts facing the camera and ~5-6 mm when turned.
  yaw_noise:
    mouth_diff: 0.002
    eye_ratio: 0.0
    brow_diff: 0.0
  # Multiplies yaw_noise for head turns covered by the baseline (calibration): those are
  # corrected for this patient and camera, so they need less tolerance. Provisional.
  yaw_noise_calibrated: 0.5
  # Guided calibration (Calibrate button): look straight for centre_s, turn to one side
  # past turn_deg and hold for hold_s, the same to the other side, then straight again.
  # A step is skipped after step_timeout_s.
  calibration:
    centre_s: 5
    turn_deg: 15
    hold_s: 2.5
    step_timeout_s: 25
  # Share of a real change the landmarks still report with the head turned (yaw, deg),
  # relative to facing the camera, for a change on the patient's LEFT; a RIGHT change uses
  # the mirror image. Deviations are divided by it (clamped 0.5-2). Measured Nov 14 2026 by
  # warping a 6 mm droop into the Mac and iPhone turn clips (left corner and mirrored right
  # corner averaged; the far side loses most). Mouth only; others not measured.
  yaw_gain:
    knots: [-60, -50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50, 60]
    mouth_diff: [0.60, 0.60, 0.75, 0.87, 0.96, 1.00, 1.00, 0.98, 0.90, 0.80, 0.64, 0.60, 0.60]
  # Per-feature multiplier on |z|. Mouth droop is the most reliable stroke sign.
  weights:
    mouth_diff: 1.0
    eye_ratio: 0.5
    brow_diff: 0.7
  # Pose-matched baseline: compare each frame only with baseline frames whose yaw and
  # pitch are within this many degrees (cancels pose-dependent landmark bias). If fewer
  # than min_pose_matches baseline frames are that close, the min_pose_matches nearest
  # ones are used instead, as long as they're all within pose_max_deg; farther poses
  # are skipped ("pose not in baseline"). pose_max_deg = pose_match_deg gives the old
  # hard cut-off. 0 = original single baseline (no pose matching).
  pose_match_deg: 0
  min_pose_matches: 30
  pose_max_deg: 10
  # EWMA time constant for smoothing z-scores.
  ewma_tau_s: 1.0
  # Score above `threshold` for `alert_seconds` of valid time -> ALERT.
  threshold: 4.0
  # Onset = first crossing of this lower level; dropping below it ends the episode.
  pre_threshold: 2.5
  alert_seconds: 6
  # Cap on time credited between two frames (so pauses/dropped frames don't count).
  max_dt: 0.25

# Combined droop detection (default; strokewatch/palsy.py): StrokeWatch's score / threshold + a learned palsy
# model's logit relative to the patient's first baseline_s seconds; ALERT at >= line for detector.alert_seconds.
# Benchmarked on 6 clips with synthetic droops (scripts/droop_eval.py): 18/36 droops caught, 0/6 false alerts
# (StrokeWatch alone: 6/36). Missing model folder or server --no-palsy: StrokeWatch's detector alone, as before.
palsy:
  enabled: true
  model_dir: runs/cv_landmark_geom_cnn_20261114-212730   # palsynet 3D-CNN (face-surface CNN), 5 folds averaged
  line: 1.74          # chosen on held-out clips at <= 1% flagged no-droop moments
  baseline_s: 20      # the model's personal baseline: its scores over the first 20 s
  avg_windows: 4      # p averaged over the last 4 model updates (~2 s)
  hop_s: 0.5          # one model update every 0.5 s, on the last 2 s of landmarks
  smooth_frames: 3    # landmark smoothing at 15 fps (training: 5 frames at ~30 fps)
  device: auto

# BE-FAST "Eyes", passive (befast.GazeMonitor). gaze = iris offset from the middle of the eye
# opening / eye width, both eyes averaged (+ = patient's left; about 0.15-0.25 at full sideways
# gaze). Eyes held to one side for window_s -> a voice-guided check starts (see exam).
# Calibrated Nov 14 2026 on ONE person's webcam (scripts/calibrate_gaze.py): straight ahead
# +0.03 (steady to ~0.01), full left +0.19, full right -0.19..-0.22, i.e. ~0.16 / 0.21 from
# centre. deviation = half of the smaller side. Re-run the script for other people/cameras.
gaze:
  baseline_samples: 150   # gaze samples (head facing camera) for the patient's own centre
  center_max: 0.06        # the centre is clipped to this, so an old deviation isn't fully absorbed
  window_s: 30            # deviation must hold this long ... (20 s: ~2.6 false/h on sim)
  deviation: 0.08         # ... with |median - centre| at least this (~half of full sideways) ...
  agree_fraction: 0.9     # ... and this share of samples on that side (fixed, not glancing)
  max_yaw_deg: 30          # use gaze samples up to this head turn (= vision.gaze_max_yaw_deg)
  max_gap_s: 10           # no gaze samples this long -> the window starts over

# Voice-guided BE-FAST check (befast.ExamRunner, ~40 s): look straight/left/right, close eyes
# + both arms out 10 s, lift both legs 5 s (only if legs are in view). Starts on a facial-droop
# ALERT or a gaze deviation (auto), or from the bed page. The face detector pauses meanwhile.
# Limb heights are in shoulder widths (wrist above shoulder; arms straight out ~ 0).
# PROVISIONAL thresholds (synthetic data only).
exam:
  auto: true
  cooldown_s: 300           # min gap between automatic checks for gaze deviation
  legs: true
  server_voice: false       # webcam beds: the bed page speaks; true = also the server's speaker
                            # (afplay/`say`; silent when the server runs in a detached tmux)
  alert_on_no_response: true  # no response to any instruction -> alert
  max_gap_s: 5              # no camera frames this long -> check cancelled
  min_samples: 5
  # Eyes are judged only if the patient followed the eye steps; otherwise the eyes part is
  # INCONCLUSIVE (instructions not followed), shown on the dashboard, not alerted. A first
  # try that isn't clean is repeated once; a sign must then show on both tries.
  head_turn_deg: 8          # head moved this far on a look step = "moved the head" (a sign
                            # from that step isn't trusted)
  gaze_min_excursion: 0.04  # eyes moved less than this between steps = "stayed in the same place"
  gaze_full_excursion: 0.08 # the better side must reach this (~half of full sideways), else
                            # "moved only slightly"
  gaze_ratio: 0.45          # weaker direction < this x stronger = can't look to that side
  gaze_wrong_way: 0.06      # eyes settled this far the opposite way = "looked the wrong way"
  gaze_hold_tol: 0.04       # eyes "held still" = within +-this of one position ...
  gaze_hold_min: 0.5        # ... for this share of a step, else "eyes kept moving"
  gaze_min_coverage: 0.4    # eyes tracked in this share of a step's frames (else: closed eyes /
                            # head turned away = not followed; face lost = not assessed)
  arm_raise_gain: 0.4       # wrist this much higher than at rest (while hearing the prompt) = raised
  arm_up_min: -0.9          # if the resting height wasn't seen: wrist at least this high (vs shoulder);
                            # live: raised -0.4..+1.0 depending on camera angle, lowered -1.3..-1.6
  raise_asym: 0.4           # "one limb not raised" also needs this height difference
  arm_drift: 0.20           # drop over the hold ...
  arm_drift_asym: 0.15      # ... and this much more than the other arm = drift
  arm_fell: -0.9            # ends below this while the other arm stays up = fell
  leg_raise_gain: 0.20      # height gain over rest = leg raised
  leg_drift: 0.20
  leg_drift_asym: 0.15

server:
  host: 127.0.0.1
  port: 8000
  jpeg_quality: 75

beds:
  # Max frames analyzed per second per camera bed (camera frames in between are dropped,
  # which keeps latency low). The detector counts valid seconds, so it works at any rate.
  analysis_fps: 15
  # Frame rate of simulated patients (--mock-beds / --mock).
  sim_fps: 10
  # Dashboard thumbnails: frames per second and width in pixels.
  thumb_fps: 4
  thumb_width: 320
  # A bed with no new frame for this long shows "camera offline".
  offline_after_s: 3

phone:
  # What phone camera pages send (web/phone.html): frames per second, longest image side
  # in pixels, and JPEG quality (0-1). Rotation is set per phone, on the phone.
  send_fps: 10
  max_side: 640
  jpeg_quality: 0.7

tunnel:
  # cloudflared transport: auto (QUIC, falling back to HTTP/2), or force http2 if a
  # network blocks QUIC (UDP 7844).
  protocol: auto
